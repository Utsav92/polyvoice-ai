# Larger cloud run: closer to original VITS width. UNTESTED; fp32 only.
device: auto
data_root: data/datasets/ljspeech
run_dir: runs/vits_lj_cloud_large
model:
  hidden_channels: 192
  filter_channels: 768
  inter_channels: 192
  n_layers: 6
  n_heads: 2
  upsample_initial_channel: 512
  segment_size: 8192
train:
  batch_size: 64
  grad_accum: 1
  lr: 0.0002
  lr_decay: 0.999875
  betas:
  - 0.8
  - 0.99
  clip_grad: 100.0
  c_mel: 45.0
  c_kl: 1.0
  gan_start_step: 20000
  max_steps: 800000
  workers: 8
  log_every: 50
  val_every: 5000
  ckpt_every: 5000
  keep_ckpts: 3
  seed: 0
sample_texts:
- The quick brown fox jumps over the lazy dog.
- Printing, in the only sense with which we are at present concerned, differs from
  most if not from all the arts.
