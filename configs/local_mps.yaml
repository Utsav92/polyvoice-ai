# Local Apple Silicon (24 GB unified memory). Scaled-down VITS, random init, 16 kHz, character input.
device: auto
data_root: data/datasets/ljspeech
run_dir: runs/vits_lj_local
model:
  hidden_channels: 128
  filter_channels: 512
  inter_channels: 192
  n_layers: 4
  n_heads: 2
  upsample_initial_channel: 256
  segment_size: 8192
train:
  batch_size: 48
  grad_accum: 1
  lr: 0.0002
  lr_decay: 0.999875
  betas: [0.8, 0.99]
  clip_grad: 100.0
  c_mel: 45.0
  c_kl: 1.0
  gan_start_step: 20000     # adversarial terms start after the VAE/flow/duration path has begun to converge
  max_steps: 250000
  align_bootstrap_until: 16000   # absolute step: use wav2vec2 forced alignments instead of MAS until here (MAS alone had not formed an alignment by step 12k)
  workers: 6
  log_every: 50
  val_every: 2000
  ckpt_every: 2000
  keep_ckpts: 3
  seed: 0
sample_texts:
  - "The quick brown fox jumps over the lazy dog."
  - "Printing, in the only sense with which we are at present concerned, differs from most if not from all the arts."
